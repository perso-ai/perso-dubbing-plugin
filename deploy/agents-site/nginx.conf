# Assumes the perso.ai gateway proxies /((ko|en|es|pt)/)?dubbing/agents(/...)? requests
# to this container with the URI unchanged (routing config is owned by the infra team).
server {
    listen 8080;
    server_name _;
    root /site;
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_proxied any;
    gzip_vary on;

    location = /healthz {
        return 200 'ok';
    }

    location ~ ^/(?<loc>ko|es|pt)/dubbing/agents/?$ {
        add_header Cache-Control "no-cache";
        try_files /$loc/index.html =404;
    }

    # Legacy /en path — permanent redirect to the default path.
    location ~ ^/en/dubbing/agents/?$ {
        return 301 /dubbing/agents;
    }

    # Unsupported locale prefix — fall back to the default (English) page.
    location ~ ^/[A-Za-z-]+/dubbing/agents/?$ {
        return 302 /dubbing/agents;
    }

    location ~ ^/dubbing/agents/?$ {
        add_header Cache-Control "no-cache";
        try_files /en/index.html =404;
    }

    location /dubbing/agents/ {
        expires 7d;
        try_files $uri =404;
    }
}
