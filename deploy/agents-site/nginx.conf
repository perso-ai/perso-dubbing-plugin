# perso.ai 게이트웨이가 /((ko|en|es|pt)/)?dubbing/agents(/...)? 요청을
# URI 그대로 이 컨테이너에 프록시해 주는 전제의 정적 서버 (라우팅 설정은 인프라팀 담당).
server {
    listen 8080;
    server_name _;
    root /site;
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_proxied any;
    gzip_vary on;

    location = /healthz {
        return 200 'ok';
    }

    # 언어별 랜딩 페이지
    location ~ ^/(?<loc>ko|es|pt)/dubbing/agents/?$ {
        add_header Cache-Control "no-cache";
        try_files /$loc/index.html =404;
    }

    # 구 영어 경로 → 기본 경로로 영구 이동
    location ~ ^/en/dubbing/agents/?$ {
        return 301 /dubbing/agents;
    }

    # 미지원 언어 프리픽스 → 기본(영어) 페이지로 302
    location ~ ^/[A-Za-z-]+/dubbing/agents/?$ {
        return 302 /dubbing/agents;
    }

    # 기본(영어) 페이지
    location ~ ^/dubbing/agents/?$ {
        add_header Cache-Control "no-cache";
        try_files /en/index.html =404;
    }

    # 정적 에셋 (media / fonts / perso-mark.svg)
    location /dubbing/agents/ {
        expires 7d;
        try_files $uri =404;
    }
}
