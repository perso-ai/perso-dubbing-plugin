# perso.ai 게이트웨이가 /((ko|en|es|pt)/)?dubbing/agents(/...)? 요청을
# URI 그대로 이 컨테이너에 프록시해 주는 전제의 정적 서버 (라우팅 설정은 인프라팀 담당).
map $http_accept_language $agents_locale {
    default en;
    ~*^ko   ko;
    ~*^es   es;
    ~*^pt   pt;
    ~*^en   en;
}

server {
    listen 8080;
    server_name _;
    root /site;
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location = /healthz {
        return 200 'ok';
    }

    # 언어별 랜딩 페이지
    location ~ ^/(?<loc>ko|en|es|pt)/dubbing/agents/?$ {
        add_header Cache-Control "no-cache";
        try_files /$loc/index.html =404;
    }

    # 미지원 언어 프리픽스 → 영어 페이지로 302
    location ~ ^/[A-Za-z-]+/dubbing/agents/?$ {
        return 302 /en/dubbing/agents;
    }

    # 언어 미지정 → 브라우저 언어로 302
    location ~ ^/dubbing/agents/?$ {
        return 302 /$agents_locale/dubbing/agents;
    }

    # 정적 에셋 (media / fonts / perso-mark.svg)
    location /dubbing/agents/ {
        expires 7d;
        try_files $uri =404;
    }
}
