# 해당 파일 관련 문의사항은 인프라 기술팀으로 전달 부탁 드립니다.
# Repo Settings → Environments 에 dev 환경 생성 후 PERSO_REGISTRY_USERNAME, PERSO_REGISTRY_PASSWORD 시크릿 설정 필요.
# (perso-mono-front .github/workflows/image-build.yaml 과 동일 패턴)

name: 🌈 Dubbing skill landing image push on docker registry(AKS)

on:
  push:
    tags:
      - 'dubbing-agents-**'
  workflow_dispatch:

env:
  REGISTRY_LOGIN_SERVER: azestsoftperso.azurecr.io
  DOCKER_REPOSITORY: perso-dubbing-skill-landing
  DOCKERFILE_PATH: ./deploy/agents-site

jobs:
  image:
    runs-on: az-worker # github runner server 그룹명 (수정 금지)
    environment: dev # 사용할 환경변수를 설정한 Github Environments 명

    steps:
      - name: 1️⃣ Checkout GitHub Action
        uses: actions/checkout@v4

      - name: 2️⃣ Normalize tag name
        run: |
          NORMALIZED_TAG=$(echo "${{ github.ref_name }}" | sed 's|/|-|g')
          echo "NORMALIZED_TAG=$NORMALIZED_TAG" >> $GITHUB_ENV

      - name: 3️⃣ Docker login
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.PERSO_REGISTRY_USERNAME }}
          password: ${{ secrets.PERSO_REGISTRY_PASSWORD }}

      - name: 4️⃣ Build and push image
        # 빌드 컨텍스트는 레포 루트(`.`) — Dockerfile 이 docs/ 와 deploy/ 를 루트 기준으로 COPY.
        run: |
          docker build \
            -f ${{ env.DOCKERFILE_PATH }}/Dockerfile \
            -t ${{ env.REGISTRY_LOGIN_SERVER }}/${{ env.DOCKER_REPOSITORY }}:${{ env.NORMALIZED_TAG }} .
          docker push ${{ env.REGISTRY_LOGIN_SERVER }}/${{ env.DOCKER_REPOSITORY }}:${{ env.NORMALIZED_TAG }}
